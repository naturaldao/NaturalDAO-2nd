name: 刷新副仓最近活动

on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 从测试分支手动发布副仓 main 的活动页
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: recent-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/readme_activity.py
      - name: 生成副仓 main 最近活动
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source_dir="$RUNNER_TEMP/activity-source"
          git worktree add --detach --no-checkout "$source_dir" "refs/remotes/origin/$DEFAULT_BRANCH"
          cat > "$source_dir/README.md" <<EOF
          # 最近活动 · Recent activity

          NaturalDAO-2nd 主分支最近 7 天的更新，按贡献者和日期汇总（UTC+8）。

          Updates to the NaturalDAO-2nd default branch over the past seven days, grouped by contributor and date (UTC+8).

          [返回研究首页 · Research home]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY) · [完整提交历史 · Commit history]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH/)

          <!-- readme-activity:start -->
          <!-- readme-activity:end -->
          EOF
          cd "$source_dir"
          python3 "$GITHUB_WORKSPACE/.github/scripts/readme_activity.py" --repo "$GITHUB_REPOSITORY"
          cat README.md >> "$GITHUB_STEP_SUMMARY"
      - name: 发布活动页
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$RUNNER_TEMP/activity-publish"
          target=refs/heads/recent-activity
          gh auth setup-git
          git init --initial-branch=recent-activity "$publish_dir"
          cd "$publish_dir"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          remote_ref=$(git ls-remote origin "$target")
          if [ -n "$remote_ref" ]; then
            git fetch --no-tags --depth=1 origin "$target"
            git switch --detach FETCH_HEAD
          fi
          cp "$RUNNER_TEMP/activity-source/README.md" README.md
          git add README.md
          if git diff --cached --quiet; then
            echo "活动页已是最新。"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m '刷新副仓最近活动'
          git push origin "HEAD:$target"
